; Example sections for hit_time/build_events_time.py: the keys of python/bin/example_datasets_config.ini plus the
; time keys. Replace every <...> with a path. The simulations must come from the generator of this branch (they then
; carry the step_* arrays). See the README, "Hit time".
[DEFAULT]
noise_cut=0.003
noise_sigma=5e-6
include_tracks=False
compute_spectators_dist=False
merge_particles_with_tracks=True
calibration_data=<sensor calibration .bin>
num_event_creation_cores=4
num_parallel_reading_threads=8
num_particles=60
particles_folder=<folder of single-particle simulations>
; time keys (defaults in hit_time.DEFAULTS; time_noise_gev defaults to noise_sigma)
time_threshold_fc=40
time_collision_sigma_ns=0.102
time_collision_sigma_z_cm=2.56
time_jitter=True

[pufree_with_time]
; no pileup: pu_folder is an empty folder
pu_folder=<empty folder>
num_pu=0
output_folder=<new folder>
num_events_total=5000
num_events_per_djc_file=100

[pu_with_time]
; 200 in-time pileup collisions per event, plus the out-of-time bunch crossings of the CMS Phase-2 scenario (-3..+3):
; num_pu = 200 x (1 + 6)
pu_folder=<folder of minimum-bias simulations>
num_pu=1400
pu_phase_cut=0.5235987755982988
time_oot_bunches=cms
output_folder=<new folder>
num_events_total=100
num_events_per_djc_file=100
